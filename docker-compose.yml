services:
  marstv:
    build: .
    ports:
      - "8787:8787"
    environment:
      MARSTV_PUBLIC_ORIGIN: http://localhost:8787
      MARSTV_SOURCE_MASTER_KEY: ${MARSTV_SOURCE_MASTER_KEY:?required}
      MARSTV_BOOTSTRAP_TOKEN: ${MARSTV_BOOTSTRAP_TOKEN:?required}
    volumes:
      - marstv-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  marstv-data:
