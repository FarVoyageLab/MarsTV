[package]
name = "marstv-desktop"
version = "1.0.0"
description = "MarsTV private household media client"
authors = ["FarVoyageLab contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/FarVoyageLab/MarsTV"
edition = "2024"
rust-version = "1.85"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "marstv_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-stronghold = "2"
url = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
